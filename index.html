<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Redirect</title>
</head>
<body>

<script>
const params = new URLSearchParams(window.location.search);
const msisdn = params.get("msisdn");

if (msisdn) {
    window.location.href = "sms:1900?body=PORT " + encodeURIComponent(msisdn);
} else {
    document.body.innerHTML = "<h2>Mobile number not found.</h2>";
}
</script>

</body>
</html>
